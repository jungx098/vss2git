[project]
name = "vss2git"
version = "0.1.0"
description = "Migrate a Visual SourceSafe 6.0 database to Git"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
vss2git = "vss2git.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
